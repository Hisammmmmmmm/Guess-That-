<!DOCTYPE html>
<html>
<head>
<style>
.pixelated-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: black;
}
.pixelated-img {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 10%;
  height: 10%;
  object-fit: cover;
  transform: translate(-50%, -50%) scale(10);
  image-rendering: pixelated;
}
</style>
</head>
<body>
<div class="pixelated-container">
  <img src="https://image.pollinations.ai/prompt/cat?width=800&height=450" class="pixelated-img">
</div>
</body>
</html>
